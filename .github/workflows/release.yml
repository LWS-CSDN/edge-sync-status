name: 验证与发布 Windows 安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 验证后端行为、安装身份和消息协议
        shell: pwsh
        run: |
          python -I -B host/test_sync_status.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/*.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/background.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/popup.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check extension/i18n.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包 Windows x64 完整安装包
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            python -I -B scripts/build_release.py --tag $env:RELEASE_TAG
          } else {
            python -I -B scripts/build_release.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-release
          path: dist
      - name: 提取英文发布说明并链接中文记录
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          tag = os.environ['RELEASE_TAG']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = r'^## \[' + re.escape(tag[1:]) + r'\][^\n]*\n(.*?)(?=^## |\Z)'
          section = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          if not section or not section.group(1).strip():
              raise SystemExit('CHANGELOG.md is missing release notes for ' + tag)
          chinese_changelog = Path('CHANGELOG.zh-CN.md').read_text(encoding='utf-8')
          chinese_section = re.search(pattern, chinese_changelog, flags=re.MULTILINE | re.DOTALL)
          if not chinese_section or not chinese_section.group(1).strip():
              raise SystemExit('CHANGELOG.zh-CN.md is missing release notes for ' + tag)
          repo = os.environ['GITHUB_REPOSITORY']
          language_link = f'[简体中文](https://github.com/{repo}/blob/{tag}/CHANGELOG.zh-CN.md)'
          notes = '**English** | ' + language_link + '\n\n' + section.group(1).strip() + '\n'
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: 创建 GitHub Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt \
            --verify-tag \
            --title "Edge 同步状态 $RELEASE_TAG" \
            --notes-file ../release-notes.md
