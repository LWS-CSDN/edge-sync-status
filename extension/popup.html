<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Edge 同步状态</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Edge 同步状态</h1>
    <button id="refresh" type="button">刷新</button>
  </header>
  <p class="muted">当前读取：Edge 默认配置文件（Default）。其他配置文件暂不支持。</p>

  <section id="summary" class="card">
    <p class="muted">正在读取本机同步记录…</p>
  </section>

  <section class="card">
    <h2>各类数据最近一次成功上传</h2>
    <div id="types"></div>
  </section>

  <section class="card">
    <h2>设备</h2>
    <div id="devices"></div>
  </section>

  <section class="card">
    <h2>最近的同步记录</h2>
    <div id="events"></div>
  </section>

  <p class="foot"><a id="help" href="help.html" target="_blank">使用说明</a></p>

  <script src="popup.js"></script>
</body>
</html>
